[env:nicenano_dx_lr30_repeater]
extends = nrf52_base
custom_auto_uf2 = yes
monitor_port = COM29
monitor_speed = 115200
board = promicro_nrf52840
board_build.variant = arduino
board_build.variants_dir = variants/nicenano_dx_lr30
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_unflags =
  -D LORA_FREQ=433.375
  -D LORA_SF=9
build_flags = ${nrf52_base.build_flags}
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=6
  -I variants/nicenano_dx_lr30
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=14
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D ADVERT_NAME='"Luso DX-LR30 Repeater"'
  -D REPEATER_BOOT_DIAGNOSTICS=1
  -D BATTERY_VIA_VDDH=1
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/sensors>
  +<../variants/nicenano_dx_lr30/target.cpp>
  +<../examples/simple_repeater>

[env:nicenano_dx_lr30_companion_radio_ble]
extends = nrf52_base
custom_auto_uf2 = yes
monitor_speed = 115200
board = promicro_nrf52840
board_build.variant = arduino
board_build.variants_dir = variants/nicenano_dx_lr30
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_unflags =
  -D LORA_FREQ=433.375
  -D LORA_SF=9
build_flags = ${nrf52_base.build_flags}
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=6
  -I variants/nicenano_dx_lr30
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=14
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D ADVERT_NAME='"Luso DX-LR30 Companion"'
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/sensors>
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<../variants/nicenano_dx_lr30/target.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps = ${nrf52_base.lib_deps}
  densaugeo/base64 @ ~1.4.0
